<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="minhas-compras.css" />
  <title>Minhas Compras | CHI RHO</title>
</head>
<body>
  <header class="portal-header">
    <a class="portal-brand" href="index.html" aria-label="Voltar para CHI RHO">
      <img src="assets/logo-chi-rho.png" alt="CHI RHO" />
      <span><strong>CHI RHO</strong><small>CASA • FAMÍLIA • FÉ</small></span>
    </a>
    <a class="back-link" href="index.html">← Voltar à loja</a>
  </header>

  <main class="portal-shell">
    <section class="portal-card" aria-labelledby="portal-title">
      <div class="portal-heading">
        <span>ÁREA DO CLIENTE</span>
        <h1 id="portal-title">Minhas Compras</h1>
        <p>Acompanhe seus pedidos e entregas usando o mesmo WhatsApp informado na compra.</p>
      </div>

      <div id="availability-message" class="notice" role="status" hidden></div>

      <form id="request-form" class="auth-form">
        <label for="whatsapp">WhatsApp com DDD</label>
        <input id="whatsapp" name="whatsapp" type="tel" inputmode="tel" autocomplete="tel" placeholder="(21) 99999-9999" maxlength="16" required />
        <button id="request-button" type="submit">Receber código</button>
        <p class="privacy-note">Enviaremos um código temporário para confirmar sua identidade. Não usamos senha permanente.</p>
      </form>

      <form id="verify-form" class="auth-form" hidden>
        <label for="otp">Digite o código recebido</label>
        <input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="10" placeholder="Código" required />
        <button id="verify-button" type="submit">Confirmar código</button>
        <div class="form-actions">
          <button id="resend-button" class="link-button" type="button">Reenviar código</button>
          <button id="change-number-button" class="link-button" type="button">Usar outro número</button>
        </div>
      </form>

      <section id="orders-section" hidden>
        <div class="orders-header">
          <div>
            <span>Olá, <strong id="customer-name">cliente</strong></span>
            <h2>Seus pedidos</h2>
          </div>
          <button id="logout-button" class="secondary-button" type="button">Sair</button>
        </div>
        <div id="orders-list" class="orders-list" aria-live="polite"></div>
      </section>
    </section>
  </main>

  <script type="module" src="minhas-compras.js"></script>
</body>
</html>
