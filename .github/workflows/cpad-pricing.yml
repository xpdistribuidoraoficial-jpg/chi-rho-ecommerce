name: Validar cálculo e checkout dos kits CPAD
on:
  pull_request:
    paths:
      - 'data/cpad-kit-list-prices.mjs'
      - 'lib/kit-pricing.mjs'
      - 'checkout.js'
      - 'tests/**'
      - '.github/workflows/cpad-pricing.yml'
  push:
    branches:
      - 'fix/cpad-kits-desconto-preco-cheio'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:syntax
      - run: node --test tests/kit-pricing.test.mjs tests/cpad-api.test.mjs tests/beacon-payment.test.mjs
