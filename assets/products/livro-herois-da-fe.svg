<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900" role="img" aria-labelledby="title desc">
  <title id="title">HERÓIS DA FÉ — ORLANDO BOYER</title>
  <desc id="desc">Capa ilustrativa criada para o catálogo Chi Rho; não representa a capa comercial do produto</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5ecdc"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#946723"/><stop offset="1" stop-color="#052e46"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#052e46" flood-opacity=".25"/></filter>
  </defs>
  <rect width="800" height="900" fill="url(#bg)"/>
  <circle cx="690" cy="145" r="135" fill="#946723" opacity=".10"/>
  <circle cx="90" cy="790" r="165" fill="#ffffff" opacity=".55"/>
  <g filter="url(#shadow)">
    <rect x="174" y="62" width="452" height="752" rx="24" fill="url(#cover)"/>
    <rect x="174" y="62" width="32" height="752" rx="16" fill="#021925" opacity=".35"/>
    <rect x="224" y="112" width="352" height="3" fill="#ffffff" opacity=".56"/>
    <circle cx="400" cy="250" r="78" fill="#ffffff" opacity=".11"/>
    <text x="400" y="274" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" text-anchor="middle">★</text>
    <text x="400" y="414" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="middle" letter-spacing="1">HERÓIS</text>
    <text x="400" y="460" fill="#d9fffb" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="middle" letter-spacing="1">DA FÉ</text>
    <text x="400" y="550" fill="#ffffff" opacity=".82" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle" letter-spacing="2">ORLANDO BOYER</text>
    <text x="400" y="710" fill="#ffffff" opacity=".72" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="3">CAPA ILUSTRATIVA</text>
    <text x="400" y="747" fill="#ffffff" opacity=".62" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="3">SELEÇÃO CHI RHO</text>
  </g>
</svg>