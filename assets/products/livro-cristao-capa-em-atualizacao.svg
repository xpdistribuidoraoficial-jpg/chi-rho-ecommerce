<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900" role="img" aria-labelledby="title desc">
  <title id="title">Livro cristão — imagem em atualização</title>
  <desc id="desc">Capa provisória do catálogo Chi Rho enquanto a imagem oficial do produto é validada</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef9f7"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#073b59"/>
      <stop offset="1" stop-color="#12766f"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#052e46" flood-opacity=".24"/>
    </filter>
  </defs>
  <rect width="800" height="900" fill="url(#background)"/>
  <circle cx="690" cy="140" r="140" fill="#1a9b91" opacity=".09"/>
  <circle cx="92" cy="792" r="175" fill="#f47c2f" opacity=".07"/>
  <g filter="url(#shadow)">
    <rect x="174" y="62" width="452" height="752" rx="24" fill="url(#cover)"/>
    <rect x="174" y="62" width="32" height="752" rx="16" fill="#021925" opacity=".35"/>
    <rect x="224" y="112" width="352" height="3" fill="#ffffff" opacity=".5"/>
    <circle cx="400" cy="260" r="82" fill="#ffffff" opacity=".1"/>
    <text x="400" y="286" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" text-anchor="middle">✦</text>
    <text x="400" y="424" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" text-anchor="middle" letter-spacing="2">LIVRO CRISTÃO</text>
    <text x="400" y="474" fill="#d9fffb" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="2">SELEÇÃO CHI RHO</text>
    <rect x="260" y="540" width="280" height="1" fill="#ffffff" opacity=".35"/>
    <text x="400" y="610" fill="#ffffff" opacity=".76" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle" letter-spacing="1">IMAGEM OFICIAL</text>
    <text x="400" y="642" fill="#ffffff" opacity=".76" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle" letter-spacing="1">EM ATUALIZAÇÃO</text>
  </g>
</svg>
